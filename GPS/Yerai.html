<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Yerai</title>
  <style>
    :root {
      --navy: #0F3D56;
      --teal: #176B85;
      --pale: #E6F2F6;
      --button: #171C22;
      --ink: #16343A;
      --bg: #F4F9FA;
      --surface: #FFFFFF;
      --line: #C7DCE3;
      --muted: #55727A;
      --safe: #167245;
      --safe-bg: #EAF5EE;
      --warn: #9B5C08;
      --warn-bg: #FFF4DD;
      --danger: #BE2929;
      --danger-bg: #FCE8E8;
      --font-scale: 1;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #eaf1f3;
      font-size: calc(100% * var(--font-scale));
    }
    [data-theme="dark"] {
      --navy: #0F3D56;
      --teal: #176B85;
      --pale: #233F49;
      --button: #171C22;
      --ink: #EAF3F5;
      --bg: #101D22;
      --surface: #18313A;
      --line: #48636B;
      --muted: #B4C9CE;
      --safe: #9CE0B7;
      --safe-bg: #173D31;
      --warn: #FFD98D;
      --warn-bg: #493B22;
      --danger: #FFB1B1;
      --danger-bg: #492929;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eaf1f3;
      color: var(--ink);
      font-size: 0.9rem;
    }
    [data-theme="dark"] body { background: #10191e; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #66b7d0;
      outline-offset: 2px;
    }
    .app-frame {
      width: min(100%, 440px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 19px;
      overflow: hidden;
      box-shadow: 0 12px 42px rgba(14, 49, 61, .12);
    }
    .app-header {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      color: #fff;
      background: var(--navy);
    }
    .brand-mark {
      width: 38px; height: 38px; flex: 0 0 38px;
      display: grid; place-items: center;
      border-radius: 13px;
      border: 0; padding: 0; cursor: pointer;
      color: #fff;
      background: var(--teal);
    }
    .brand-copy { flex: 1; min-width: 0; }
    .brand-name { margin: 0; font-size: 1.38rem; line-height: 1.1; font-weight: 750; letter-spacing: -.03em; }
    .brand-tagline { margin: 4px 0 0; font-size: .72rem; opacity: .92; }
    .header-actions { display: flex; align-items: center; gap: 2px; }
    .icon-button {
      width: 34px; height: 36px; display: grid; place-items: center;
      border: 0; border-radius: 10px; background: transparent; color: #fff; cursor: pointer;
    }
    .icon-button:hover, .icon-button.current { background: rgba(255,255,255,.16); }
    main { flex: 1; padding: 14px 12px 12px; background: var(--surface); }
    .footer {
      display: flex; justify-content: center; align-items: center; gap: 6px;
      min-height: 38px; padding: 8px 12px; text-align: center;
      color: var(--muted); background: var(--pale); font-size: .72rem;
    }
    .demo-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 10px; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 10px; color: var(--muted); background: var(--bg); font-size: .7rem;
    }
    .demo-label { display: inline-flex; align-items: center; gap: 5px; }
    .demo-chip { color: var(--teal); font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .text-button {
      border: 0; padding: 3px 2px; background: transparent; color: var(--teal);
      font-weight: 700; cursor: pointer;
    }
    .page-card {
      padding: 12px; border-radius: 14px; background: var(--pale);
      color: var(--ink); margin-bottom: 10px;
    }
    .eyebrow { margin: 0 0 5px; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .page-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .domain { display: flex; align-items: center; gap: 7px; font-weight: 700; overflow-wrap: anywhere; }
    .active-state { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
    .notice {
      display: flex; gap: 10px; margin: 10px 0; padding: 12px;
      border-radius: 14px; border: 1px solid transparent;
    }
    .notice.safe { color: var(--safe); background: var(--safe-bg); }
    .notice.warn { color: var(--warn); background: var(--warn-bg); }
    .notice.danger { color: var(--danger); background: var(--danger-bg); }
    .notice-icon { flex: 0 0 auto; margin-top: 1px; }
    .notice h2 { margin: 0; font-size: .85rem; line-height: 1.35; }
    .notice p { margin: 5px 0 0; color: var(--ink); line-height: 1.4; }
    .notice .notice-action { margin-top: 9px; }
    .notice .notice-action button {
      width: 100%; min-height: 36px; border: 0; border-radius: 999px;
      color: #fff; background: var(--danger); font-weight: 700; cursor: pointer;
    }
    .section-title { margin: 12px 0 8px; font-size: .83rem; font-weight: 750; }
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .mode-card {
      min-height: 80px; border: 1px solid var(--line); border-radius: 13px;
      background: var(--pale); color: var(--ink); display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 4px; padding: 8px 4px;
      cursor: pointer; transition: transform .12s ease, background .12s ease;
    }
    .mode-card:hover { transform: translateY(-1px); }
    .mode-card.selected { background: var(--teal); border-color: var(--teal); color: #fff; }
    .mode-card strong { font-size: .76rem; }
    .mode-card small { font-size: .65rem; opacity: .86; }
    .mode-info {
      margin-top: 8px; padding: 11px 12px; border: 1px solid #A8D2E0;
      border-radius: 13px; color: var(--ink); background: var(--pale);
    }
    [data-theme="dark"] .mode-info { border-color: #557780; }
    .mode-info-title { display: flex; align-items: center; gap: 7px; color: var(--teal); font-weight: 750; }
    .mode-info p { margin: 8px 0 5px; line-height: 1.43; }
    .mode-info small { color: var(--muted); }
    .primary-button, .secondary-button, .outline-button {
      min-height: 42px; border-radius: 13px; cursor: pointer; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .primary-button { width: 100%; margin-top: 10px; border: 0; background: var(--button); color: #fff; }
    .primary-button:hover { filter: brightness(1.14); }
    .secondary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .outline-button { width: 100%; border: 1px solid var(--line); background: transparent; color: var(--ink); }
    .outline-button:hover { background: var(--pale); }
    .back-button { display: flex; width: fit-content; gap: 7px; align-items: center; margin: 0 auto 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .page-heading { margin: 0 0 10px; font-size: 1.24rem; letter-spacing: -.02em; }
    .risk-summary { padding: 12px; border-radius: 14px; background: var(--pale); }
    .risk-summary .domain { margin-bottom: 9px; }
    .risk-line { display: flex; gap: 7px; align-items: center; }
    .risk-score { display: flex; align-items: baseline; gap: 7px; margin-top: 11px; }
    .risk-score strong { font-size: 2.2rem; line-height: 1; }
    .risk-score span { color: var(--muted); font-size: .75rem; }
    .risk-summary p { margin: 7px 0 0; color: var(--muted); line-height: 1.4; font-size: .77rem; }
    .checks { margin: 13px 0; }
    .check-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 2px; }
    .check-icon { flex: 0 0 16px; color: var(--teal); margin-top: 1px; }
    .check-row strong { display: block; font-size: .78rem; font-weight: 650; }
    .check-row small { display: block; margin-top: 3px; color: var(--muted); font-size: .72rem; line-height: 1.35; }
    .explanation { padding: 11px 12px; border-radius: 13px; background: var(--safe-bg); color: var(--ink); }
    .explanation.risk { background: var(--warn-bg); }
    .explanation strong { display: block; margin-bottom: 5px; font-size: .78rem; }
    .explanation p { margin: 0; line-height: 1.42; font-size: .78rem; }
    .detail-list { margin-top: 8px; display: grid; gap: 7px; }
    .detail-item { padding: 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .detail-item.active { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(190,41,41,.13); }
    .detail-item strong { display: block; font-size: .78rem; }
    .detail-item p { margin: 4px 0 8px; font-size: .74rem; color: var(--muted); line-height: 1.4; }
    .detail-item button { border: 0; padding: 0; color: var(--teal); background: transparent; font-weight: 700; font-size: .72rem; cursor: pointer; }
    .subtle-note { margin: 9px 0 0; color: var(--muted); font-size: .7rem; line-height: 1.4; }
    .history-list { display: grid; gap: 8px; }
    .history-item { display: flex; align-items: center; gap: 9px; padding: 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .history-item .history-copy { flex: 1; min-width: 0; }
    .history-item strong { display: block; font-size: .8rem; }
    .history-item small { display: block; margin-top: 3px; color: var(--muted); font-size: .7rem; }
    .history-item button { border: 0; background: transparent; color: var(--teal); font-weight: 700; cursor: pointer; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row label, .setting-row strong { font-size: .8rem; }
    .setting-row small { display: block; color: var(--muted); font-size: .7rem; margin-top: 3px; }
    select, input, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
      color: var(--ink); background: var(--surface);
    }
    .setting-row select { width: auto; min-width: 115px; }
    textarea { min-height: 84px; resize: vertical; }
    .form-label { display: block; margin: 12px 0 6px; font-size: .78rem; font-weight: 700; }
    .tag-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-option { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; font-size: .73rem; }
    .tag-option input { width: auto; accent-color: var(--teal); }
    .inline-feedback { display: flex; align-items: flex-start; gap: 7px; margin: 0 0 10px; padding: 9px 10px; border: 1px solid #A8D2E0; border-radius: 11px; color: var(--ink); background: var(--pale); font-size: .75rem; line-height: 1.4; }
    .empty-state { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
    @media (min-width: 600px) {
      body { padding: 20px 0; }
      .app-frame { min-height: min(860px, calc(100vh - 40px)); }
    }
    @media (max-width: 380px) {
      main { padding: 11px 9px; }
      .app-header { padding: 12px 11px; }
      .brand-name { font-size: 1.24rem; }
      .mode-card { min-height: 74px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

      event.preventDefault();
      const form = event.currentTarget;
      const tags = Array.from(form.querySelectorAll('input[type="checkbox"]:checked')).map(function (input) { return input.value; });
      const details = form.querySelector("#reportDetails").value.trim();
      state.reports.unshift({ domain: "ejemplo.com", tags: tags, details: details, when: new Date().toLocaleTimeString(state.lang === "es" ? "es-ES" : "en-US", { hour: "2-digit", minute: "2-digit" }) });
      state.view = "home";
      state.message = t("reportSaved");
      render();
    }
    function demoAuth(event) { event.preventDefault(); state.message = t("authDemo"); render(); }
    function requestDelete() { state.view = "account"; state.message = t("deleteDemo"); render(); }
    render();
    render();
  </script>
</body>
</html>
